name: Publish Python

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the only thing that names the version being released, but
      # `uv build` reads the version out of `pyproject.toml`. When the two
      # disagree the build still succeeds and the failure surfaces two jobs
      # later, as a duplicate-file rejection from PyPI — so compare them here,
      # before anything is built or uploaded.
      - name: Verify the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#python-v}"
          pyproject_version="$(awk '/^\[project\]$/{f=1;next} /^\[/{f=0} \
            f && /^version *= *"/{gsub(/^version *= *"|"$/,""); print; exit}' pyproject.toml)"
          dunder_version="$(sed -n 's/^__version__ *= *"\(.*\)"$/\1/p' \
            src/neo4j_agent_memory/__init__.py)"
          echo "tag=${tag_version} pyproject=${pyproject_version} __version__=${dunder_version}"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} releases ${tag_version}, but pyproject.toml declares ${pyproject_version}"
            exit 1
          fi
          if [ "$tag_version" != "$dunder_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} releases ${tag_version}, but __version__ is ${dunder_version}"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neo4j-agent-memory
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
