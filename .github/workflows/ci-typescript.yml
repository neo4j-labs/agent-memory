name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'
      - 'docs/modules/ROOT/pages/tutorials/*typescript.adoc'
      - 'docs/modules/ROOT/partials/typescript-tutorial*.adoc'
      - 'docs/modules/ROOT/pages/how-to/typescript/**'
      - 'docs/modules/ROOT/pages/reference/typescript-api.adoc'
      - 'docs/modules/ROOT/pages/reference/nams-ai-provider.adoc'
      - 'docs/modules/ROOT/pages/explanation/nams-ai-provider-retrieval.adoc'
      - 'docs/modules/ROOT/pages/sdks/typescript.adoc'
  pull_request:
    branches: [main]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'
      - 'docs/modules/ROOT/pages/tutorials/*typescript.adoc'
      - 'docs/modules/ROOT/partials/typescript-tutorial*.adoc'
      - 'docs/modules/ROOT/pages/how-to/typescript/**'
      - 'docs/modules/ROOT/pages/reference/typescript-api.adoc'
      - 'docs/modules/ROOT/pages/reference/nams-ai-provider.adoc'
      - 'docs/modules/ROOT/pages/explanation/nams-ai-provider-retrieval.adoc'
      - 'docs/modules/ROOT/pages/sdks/typescript.adoc'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: Lint + Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Verify packed artifact
        run: npm pack --dry-run

  # Every directory under typescript/examples/ is type-checked, tested and (where
  # it has a build script) built against the freshly built SDK, so API drift
  # fails the PR that introduces it. Mirrored locally by `make ts-test-examples`.
  #
  # Most examples use Node 24; maintained tutorials also exercise their Node 22 floor.
  type-check-examples:
    name: Example (${{ matrix.example }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
        example:
          - cloudflare-agents-edge
          - eve-commerce-agent
          - langchain
          - mastra
          - mcp
          - nams-ai-provider
          - nextjs-memory-chat
          - ontology-lifecycle
          - strands
          - vercel-ai
        include:
          - example: vercel-ai
            node: '22'
          - example: mcp
            node: '22'
          - example: nams-ai-provider
            node: '22'
          - example: ontology-lifecycle
            node: '22'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: 'Build SDK (populates typescript/dist for file: deps)'
        working-directory: typescript
        run: |
          npm ci
          npm run build

      # Examples that depend on @neo4j-labs/nams-ai-provider via
      # file:../../packages/vercel-ai-provider (nams-ai-provider and
      # nextjs-memory-chat) need its dist/, which is gitignored. Build it
      # before installing any example whose package.json links the package.
      - name: 'Build vercel-ai-provider package (populates dist for examples that link it)'
        working-directory: typescript
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          if grep -q 'packages/vercel-ai-provider' "examples/$EXAMPLE/package.json"; then
            cd packages/vercel-ai-provider
            npm ci
            npm run build
          else
            echo "$EXAMPLE does not link packages/vercel-ai-provider; skipping"
          fi

      # `npm ci` where the example commits a lockfile, `npm install` otherwise.
      # See the lockfile policy in typescript/examples/README.md: a committed
      # lockfile buys reproducibility, a floating example acts as a drift
      # detector against its frameworks' latest releases.
      - name: Install example dependencies
        working-directory: typescript/examples/${{ matrix.example }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::notice::no package-lock.json — using npm install"
            npm install --no-package-lock
          fi

      - name: Type-check example
        working-directory: typescript/examples/${{ matrix.example }}
        run: npx tsc --noEmit

      # All ten ship an offline vitest suite.
      - name: Test example
        working-directory: typescript/examples/${{ matrix.example }}
        run: npm test --if-present

      # Builds the Next.js flagship and the Workers bundle; a no-op elsewhere.
      - name: Build example
        working-directory: typescript/examples/${{ matrix.example }}
        run: npm run build --if-present

  vercel-ai-provider:
    name: Vercel AI provider package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/packages/vercel-ai-provider
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: typescript/packages/vercel-ai-provider/package-lock.json

      # The package's devDependency on @neo4j-labs/agent-memory is a file:../..
      # link, so type-check and build resolve the checkout's dist — build it
      # first, exactly as the examples job does.
      - name: 'Build SDK (populates typescript/dist for the file: dep)'
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify packed artifact
        run: npm pack --dry-run

  eve-memory-eval:
    # Runs @neo4j-labs/nams-ai-provider/eve inside eve's own runtime.
    name: eve memory eval (eve ${{ matrix.eve }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.eve == 'latest' }}
    defaults:
      run:
        working-directory: typescript/packages/vercel-ai-provider/examples/eve-memory-eval
    strategy:
      fail-fast: false
      matrix:
        eve: ['pinned', 'latest']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # eve requires Node.js 24 or newer.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            typescript/package-lock.json
            typescript/packages/vercel-ai-provider/package-lock.json

      # The eval app installs the SDK and the provider from this checkout
      # (file: links, packed by its .npmrc), so build both first.
      - name: Build SDK
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Build provider
        working-directory: typescript/packages/vercel-ai-provider
        run: |
          npm ci
          npm run build

      - name: Install the eval app
        run: npm install --no-audit --no-fund

      - name: Switch to the latest eve release
        if: matrix.eve == 'latest'
        run: npm install --no-audit --no-fund --no-save eve@latest

      - name: Type-check
        run: npm run typecheck

      - name: Run the eval
        run: |
          echo "eve $(node -p "require('./node_modules/eve/package.json').version")"
          npx eve eval
