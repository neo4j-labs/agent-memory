name: Publish NAMS AI provider

on:
  push:
    tags:
      - "nams-ai-provider-v*"

defaults:
  run:
    working-directory: typescript/packages/vercel-ai-provider

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@neo4j-labs/nams-ai-provider
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: typescript/packages/vercel-ai-provider/package-lock.json

      # The package's devDependency on @neo4j-labs/agent-memory is a file:../..
      # link, so type-check and build resolve the checkout's dist — build it
      # first, exactly as ci-typescript.yml does.
      - name: 'Build SDK (populates typescript/dist for the file: dep)'
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          name: "NAMS AI provider ${{ github.ref_name }}"
