yle="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Registers "agent-memory-tutorial" as a stdio server</text></g><g stroke-linecap="round"><g transform="translate(514 184) rotate(0 0 40)"><path d="M0.41 0.53 C0.47 14, -0.68 67.24, -0.82 80.46 M-0.83 -0.24 C-0.29 12.9, 1.56 65.03, 1.46 78.58" stroke="#6366f1" stroke-width="2" fill="none"></path></g><g transform="translate(514 184) rotate(0 0 40)"><path d="M-7.49 55.24 C-4.88 58.53, -3.19 63.88, 1.46 78.58 M-7.49 55.24 C-5.78 62.49, -1.8 67.69, 1.46 78.58" stroke="#6366f1" stroke-width="2" fill="none"></path></g><g transform="translate(514 184) rotate(0 0 40)"><path d="M9.61 54.95 C8.78 58.36, 7.03 63.76, 1.46 78.58 M9.61 54.95 C6.42 62.29, 5.49 67.58, 1.46 78.58" stroke="#6366f1" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(549 199) rotate(0 210 27)"><text x="0" y="15.1203125" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">MCP protocol over local stdio</text><text x="0" y="36.720312500000006" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">(JSON-RPC, no network port)</text></g><g stroke-linecap="round" transform="translate(89 264) rotate(0 425 80)"><path d="M32 0 C280.34 -5.17, 528.73 -3.44, 818 0 C842.38 -1.22, 848.05 12.24, 850 32 C848.94 55.91, 849.47 78.06, 850 128 C847.59 150.83, 840.01 163.17, 818 160 C583.71 160.7, 350.68 159.75, 32 160 C11.97 159.54, -1.45 148.46, 0 128 C-0.57 101.91, -1.65 71.61, 0 32 C3.31 9.43, 8.6 -1.01, 32 0" stroke="none" stroke-width="0" fill="#a5d8ff"></path><path d="M32 0 C189.37 -2.13, 347.91 -1.7, 818 0 M32 0 C213.11 2.72, 394.69 2.3, 818 0 M818 0 C838.08 -0.99, 849.05 11.91, 850 32 M818 0 C841.17 -1.68, 848.72 10.85, 850 32 M850 32 C848.45 53.34, 850.26 70.88, 850 128 M850 32 C849.46 55.08, 849.