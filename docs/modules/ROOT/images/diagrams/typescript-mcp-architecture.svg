 65.74, -1.5 75.94, 1.33 81.07" stroke="#6366f1" stroke-width="2" fill="none"></path></g><g transform="translate(514 424) rotate(0 0 40)"><path d="M9.95 57.6 C8.61 60.73, 6.06 66.9, 1.33 81.07 M9.95 57.6 C6.3 65.85, 2.78 76.03, 1.33 81.07" stroke="#6366f1" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(549 439) rotate(0 230 27)"><text x="0" y="15.1203125" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">HTTPS + Bearer apiKey (MEMORY_API_KEY)</text><text x="0" y="36.720312500000006" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">MemoryClient({ transport: "rest" })</text></g><g stroke-linecap="round" transform="translate(164 504) rotate(0 350 55)"><path d="M27.5 0 C282.19 -4.16, 538.69 -3.37, 672.5 0 C690.51 2.32, 699.76 10.56, 700 27.5 C700.35 48.79, 702.5 61.93, 700 82.5 C702.92 101.17, 693.2 112.25, 672.5 110 C518.48 109.61, 365.18 109.62, 27.5 110 C5.74 112.81, -0.01 102.32, 0 82.5 C-0.35 68.06, -2.57 52.75, 0 27.5 C-2.29 12.1, 11.39 -2.92, 27.5 0" stroke="none" stroke-width="0" fill="#a5d8ff"></path><path d="M27.5 0 C156.32 1.31, 286.26 0.45, 672.5 0 M27.5 0 C233.14 0.78, 438.25 0.71, 672.5 0 M672.5 0 C692.39 1.13, 698.57 8.92, 700 27.5 M672.5 0 C688.86 0.56, 697.98 7.08, 700 27.5 M700 27.5 C700.73 41.27, 700.79 58.16, 700 82.5 M700 27.5 C700.11 50.11, 699.5 72.37, 700 82.5 M700 82.5 C699.02 99.14, 690.49 110.75, 672.5 110 M700 82.5 C701.77 102.53, 691.85 112.23, 672.5 110 M672.5 110 C484.3 112.39, 296.18 112.51, 27.5 110 M672.5 110 C464.89 109.72, 256.46 109.17, 27.5 110 M27.5 110 C10.93 111.63, 1.09 101.64, 0 82.5 M27.5 110 C9.5 108.61, 0.41 100.34, 0 82.5 M0 82.5 C-1 68.74, -0.91 58.24, 0 27.5 M0 82.5 C0.42 69.8, 0.25 55.05, 0 27.5 M0 27.5 C1.54 10.42, 9.35 -0.65, 27.5 0 M0 27.5 C0.83 8.93, 8.14 1.12, 27.5 0" stroke="#1971c2" stroke-width="2" fill="none"></path></g><g transform="translate(182 522) rotate(0 332 37)"><text x="0" y="18.900390625" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">NAMS workspace (hosted) — memory.neo4jlabs.com</text><text x="0" y="45.900390625" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Conversations · entities. No Aura credentials or local database.</text></g><g transform="translate(24 664) rotate(0 500 27)"><text x="0" y="15.1203125" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Reasoning-memory tools are excluded from this server: NAMS has no verified complete cleanup route for those records.</text><text x="0" y="36.720312500000006" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The workspace-scoped MEMORY_API_KEY cannot rotate or revoke itself; only an authenticated owner or admin client can.</text></g></svg>
