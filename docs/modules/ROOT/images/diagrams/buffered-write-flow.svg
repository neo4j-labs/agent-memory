abetic">Optional error callback</text></g><g stroke-linecap="round"><g transform="translate(514 576.5) rotate(0 -70 0)"><path d="M1.1 -0.51 C-22.06 -0.29, -116.57 0.09, -140.16 0.16 M0.21 -1.82 C-23.02 -1.29, -117.58 1.28, -141.19 1.78" stroke="#6366f1" stroke-width="2" fill="none"></path></g><g transform="translate(514 576.5) rotate(0 -70 0)"><path d="M-117.91 -7.34 C-123.51 -5.56, -127.06 -4.22, -141.19 1.78 M-117.91 -7.34 C-124.55 -4.41, -131.51 -1.97, -141.19 1.78" stroke="#6366f1" stroke-width="2" fill="none"></path></g><g transform="translate(514 576.5) rotate(0 -70 0)"><path d="M-117.49 9.75 C-123.01 8.11, -126.65 6.03, -141.19 1.78 M-117.49 9.75 C-124.41 7.64, -131.5 5.03, -141.19 1.78" stroke="#6366f1" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(406 549) rotate(0 120 12.824999999999989)"><text x="0" y="17.955371093750003" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">failure</text></g><g transform="translate(44 696) rotate(0 550 13.5)"><text x="0" y="18.900390625" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Success and failure both finish the queued attempt; the drainer continues to the next job.</text></g><g stroke-linecap="round" transform="translate(74 769) rotate(0 425 67.5)"><path d="M32 0 C202.82 3.27, 373.68 4.21, 818 0 C841.91 2.73, 851.32 8.85, 850 32 C852.83 58.27, 849.57 81.89, 850 103 C849.4 121.66, 841.88 134.26, 818 135 C515.51 134.46, 211.97 136.87, 32 135 C9.84 136.91, 0.36 125.51, 0 103 C-1.18 89.81, 3.95 69.77, 0 32 C-0.14 12.62, 9.15 -0.09, 32 0" stroke="none" stroke-width="0" fill="#e8e7ff"></path><path d="M32 0 C189.52 -1.39, 347.78 -1.34, 818 0 M32 0 C276.54 0.37, 521.44 0.13, 818 0 M818 0 C838.36 0.03, 848.35 11.58, 850 32 M818 0 C840.38 -1.09, 849.48 8.58, 850 3