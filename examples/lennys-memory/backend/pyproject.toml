[project]
name = "lennys-memory-backend"
version = "0.1.0"
description = "Lenny's Podcast Memory Explorer - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-ai>=2.0,<3",
    "pydantic-settings>=2.6,<3",
    "neo4j>=5.26,<7",
    "sse-starlette>=3.4,<4",
    "python-dotenv>=1.0,<2",
    # `fuzzy` powers DeduplicationConfig(use_fuzzy_matching=True) (rapidfuzz);
    # `cli` + `mcp` are what `make mcp-server` needs (fastmcp).
    "neo4j-agent-memory[extraction,openai,fuzzy,cli,mcp]>=0.5.0,<0.7",
    "spacy>=3.8,<4",
    "gliner>=0.2.28,<1",
    "glirel>=1.2,<2",
    "en-core-web-sm",
]

[tool.uv]
package = true

# Test tooling lives in the default `dev` group, not in an extra: `uv sync`
# (what `make install` and CI run) installs dependency groups but *prunes*
# optional-dependency extras, so a `test` extra made the documented
# install -> `make test` path fail with ModuleNotFoundError: pytest_asyncio.
# pytest-timeout is required: CI and `make test` pass `--timeout=120`.
[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=4.1,<8",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<1",
]

[tool.uv.sources]
# Local development against this checkout. Deployments run `uv sync --frozen`
# against the committed uv.lock, which resolves the same editable path, so
# there is exactly one dependency declaration for the library (no
# requirements.txt). To deploy from a tag instead, replace this with:
#   neo4j-agent-memory = { git = "https://github.com/neo4j-labs/agent-memory", tag = "python-v0.5.0" }
neo4j-agent-memory = { path = "../../..", editable = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (require Neo4j)",
]
