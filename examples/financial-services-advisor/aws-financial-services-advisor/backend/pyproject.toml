[project]
name = "financial-services-advisor"
version = "0.1.0"
description = "Financial Services Advisor - AWS Strands Agents with Neo4j Agent Memory"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Neo4j Labs", email = "labs@neo4j.com" }
]
keywords = [
    "neo4j",
    "agent-memory",
    "strands-agents",
    "aws",
    "bedrock",
    "financial-services",
    "kyc",
    "aml",
    "compliance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Floors are what the code actually requires, capped at the next major so a
# fresh install cannot silently resolve a breaking release.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Needs >=1.52 for Agent.invoke_async / stream_async and the tool registry
    # behaviour this example relies on.
    "strands-agents>=1.52,<2",
    "boto3>=1.40,<2",
    "neo4j-agent-memory>=0.5.0,<0.7",
    "neo4j>=6.0,<7",
    "mangum>=0.19,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6.0,<8",
    "httpx>=0.28,<1",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
# Local development resolves the library from this repo checkout, so changes to
# src/neo4j_agent_memory are picked up without a release. The published pin
# above is what a standalone copy of this example installs.
neo4j-agent-memory = { path = "../../../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "-ra",
]
markers = [
    "integration: marks tests requiring a running Neo4j instance",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "C901",   # too complex
    # `class X(str, Enum)` stays: switching to StrEnum changes what `str(member)`
    # returns, which these models' JSON payloads and the frontend depend on.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
