[project]
name = "google-cloud-financial-advisor"
version = "0.2.0"
description = "AI-powered financial compliance assistant using Google ADK and Neo4j Agent Memory"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Neo4j Labs" }
]
keywords = ["neo4j", "agent-memory", "google-adk", "financial-services", "compliance", "aml", "kyc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.12,<3",
    # google-adk 2.x: Runner(memory_service=...), load_memory, keyword-only
    # BaseMemoryService contract. The 1.x line is not supported by this app.
    "google-adk>=2.7,<3",
    "google-genai>=2.22,<3",
    # [vertex-ai] supplies google-cloud-aiplatform + google-genai for the
    # embedder; [litellm] supplies the Gemini LLM route used for entity
    # extraction (see src/services/memory_service.py).
    "neo4j-agent-memory[google-adk,vertex-ai,litellm]>=0.5.0,<0.7",
    "neo4j>=6.3,<7",
    "python-dotenv>=1.0,<2",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
# Local development: resolve the library from the repository checkout.
# Container builds pass `--no-sources` so the PyPI release is used instead
# (the editable path lives outside the Docker build context).
neo4j-agent-memory = { path = "../../../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    # CI and `make test` run pytest with `--timeout=120`; without the plugin
    # pytest exits 4 on the unrecognized argument.
    "pytest-timeout>=2.3,<3",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # `x: T = Depends(...)` / `Query(...)` is the FastAPI idiom.
    "B008",
    # `class X(str, Enum)` keeps the JSON schema stable across pydantic
    # versions; StrEnum would change `.value` semantics in responses.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# .env must be loaded into os.environ before google-genai / ADK import.
"src/main.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
