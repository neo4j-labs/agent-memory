# Railway / nixpacks build. `uv sync --frozen` installs from the committed
# uv.lock, so pyproject.toml is the single source of truth for dependencies
# (there is deliberately no requirements.txt to drift out of step with it).
[phases.setup]
nixPkgs = ["python312", "uv"]

[phases.install]
cmds = ["uv sync --frozen --no-dev"]

[start]
cmd = "uv run --no-sync python -m uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8000}"
